[language-server.gopls.config]
gofumpt = true

# [language-server.clangd.config]
# clang-format = true

[[language]]
name = "c"
formatter = { command = "clang-format" }

[[language]]
name = "cpp"
formatter = { command = "clang-format" }

[[language]]
name = "solidity"
scope = "source.solidity"
file-types = ["sol"]
roots = ["foundry.toml", "remappings.txt"]
indent = { tab-width = 4, unit = "    " }
language-servers = ["nomic-solidity"]
# formatter = { command = "forge", args = ["fmt", "--raw", "-"] }
auto-format = true

[language-server.nomic-solidity]
command = "nomicfoundation-solidity-language-server"
args = ["--stdio"]
timeout = 30  # Give it more time

# [language-server.nomic-solidity.config]
# solidity = {
#     documentation = true,
#     completion = {
#       enabled = true,
#       showAllSymbols = true
#   }
#   }

[language-server.nomic-solidity.environment]
LOG_LEVEL = "debug"
