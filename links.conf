# What gets linked where. One link per line:
#
#   <layer>        <repo-path>                <target>
#
# layer:
#   core           every machine
#   vm             machines WITHOUT Omarchy (Omarchy-style defaults for servers/VMs)
#   desktop        Omarchy machines only (files Charlie changed from Omarchy's stock)
#   host:<name>    only the machine whose short hostname is <name>
#
# A repo-path ending in "/" is linked as a whole folder; otherwise a single file.
# When two lines share a target, the later line wins (put host: lines last).
# Paths may not contain spaces. Add new files with:  dot track <path>

# --- every machine -----------------------------------------------------------
core          core/nvim/                          ~/.config/nvim
core          core/git/config                     ~/.config/git/config

# --- machines without Omarchy (Omarchy-style defaults) -----------------------
vm            vm/bash/bashrc                      ~/.bashrc
vm            vm/tmux/tmux.conf                   ~/.config/tmux/tmux.conf
vm            vm/lazygit/config.yml               ~/.config/lazygit/config.yml
vm            vm/starship.toml                    ~/.config/starship.toml
vm            vm/mise/config.toml                 ~/.config/mise/config.toml

# --- Omarchy machines: only files changed from Omarchy's stock ---------------
desktop       desktop/hypr/bindings.lua           ~/.config/hypr/bindings.lua
desktop       desktop/omarchy/shell.json          ~/.config/omarchy/shell.json
desktop       desktop/omarchy/hooks/theme-set.d/dotfiles-record-theme ~/.config/omarchy/hooks/theme-set.d/dotfiles-record-theme
desktop       desktop/systemd/user/dotfiles-theme.path    ~/.config/systemd/user/dotfiles-theme.path
desktop       desktop/systemd/user/dotfiles-theme.service ~/.config/systemd/user/dotfiles-theme.service

# --- per machine (keep last) --------------------------------------------------
host:polaris  hosts/polaris/hypr/input.lua        ~/.config/hypr/input.lua
host:polaris  hosts/polaris/hypr/keyboard-remaps.xkb      ~/.config/hypr/keyboard-remaps.xkb
host:polaris  hosts/polaris/hypr/right-command-escape.xkb ~/.config/hypr/right-command-escape.xkb
host:aurora   hosts/aurora/hypr/monitors.lua      ~/.config/hypr/monitors.lua
host:aurora   hosts/aurora/hypr/input.lua         ~/.config/hypr/input.lua
host:aurora   hosts/aurora/xkb/rules/mackc        ~/.config/xkb/rules/mackc
host:aurora   hosts/aurora/xkb/symbols/mackc      ~/.config/xkb/symbols/mackc
